server {
    listen 8000;
    server_name _;
    root /app/public;
    index index.php;
    client_max_body_size 20M;

    # ── FIX CORS UNTUK FILE STATIS DI /storage/ ─────────────────────────
    # File di /storage/ (foto profil, foto produk, dll) disajikan langsung
    # oleh nginx sebagai file statis, TIDAK lewat Laravel/middleware CORS.
    # Makanya config/cors.php di Laravel percuma untuk request semacam
    # ini — nginx sendiri yang harus nambahin header CORS-nya.
    #
    # Tanpa ini, browser di frontend (vercel.app) akan block request ke
    # gambar dengan error:
    #   "No 'Access-Control-Allow-Origin' header is present"
    location ^~ /storage/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        # Request preflight (OPTIONS) langsung dijawab sukses tanpa isi.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\.ht {
        deny all;
    }
}