version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bumdes_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_KEY: base64:Hgk6IiMb5PHt95LwxB14AlWIIWVoiLyLHEgG4IAdX1k=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bumdes_jabar
      DB_USERNAME: bumdes
      DB_PASSWORD: bumdes
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    command: >
      sh -c "composer install --no-interaction --prefer-dist --no-progress &&
             php artisan key:generate &&
             until php artisan migrate --seed; do echo 'Waiting for MySQL...'; sleep 5; done &&
             php-fpm"
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: bumdes_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: bumdes_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: bumdes_jabar
      MYSQL_USER: bumdes
      MYSQL_PASSWORD: bumdes
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: bumdes_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
