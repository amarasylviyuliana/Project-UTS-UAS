services:
  backend:
    build: ./bumdes_jabar/laravel
    container_name: bumdes-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bumdes_jabar
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./bumdes_jabar/laravel:/app
    depends_on:
      - db
    networks:
      - bumdes-network

  frontend:
    build:
      context: ./bumdes_frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:8000
    container_name: bumdes-frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      API_BASE_URL: http://localhost:8000
    networks:
      - bumdes-network
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: bumdes-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bumdes_jabar
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bumdes-network

networks:
  bumdes-network:
    driver: bridge

volumes:
  mysql_data: