services:
  backend:
    build: ./bumdes_jabar/laravel
    container_name: bumdes-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: projectdb
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db
    networks:
      - bumdes-network

  frontend:
    build:
      context: ./bumdes_frontend
      dockerfile: Dockerfile
      args:
        # Build-time define untuk Flutter web
        API_URL: http://backend:8000
    container_name: bumdes-frontend
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      API_BASE_URL: http://192.168.1.17:8000
    networks:
      - bumdes-network


  db:
    image: mysql:8.0
    container_name: bumdes-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projectdb
    ports:
      - "3306:3306"
    networks:
      - bumdes-network

networks:
  bumdes-network:
    driver: bridge